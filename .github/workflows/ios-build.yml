name: Build Godot iOS (unsigned)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.3 and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -L -o godot.zip "$BASE/Godot_v4.3-stable_macos.universal.zip"
          curl -L -o templates.tpz "$BASE/Godot_v4.3-stable_export_templates.tpz"
          unzip -q godot.zip
          TPL_DIR="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d tpl_tmp
          mv tpl_tmp/templates/* "$TPL_DIR/"

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          ./Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "MyTaskUp" build/ios
          find build/ios -name "*.xcodeproj" -maxdepth 2

      - name: Build unsigned .app
        run: |
          PROJ=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Projet trouvé : $PROJ"
          SCHEME=$(basename "$PROJ" .xcodeproj)
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build/products" \
            build

      - name: Package IPA
        run: |
          APP=$(find build/products -name "*.app" -path "*iphoneos*" | head -n 1)
          echo "App d'origine: $APP"
          
          APP_DIR=$(dirname "$APP")
          
          # Renommer le dossier .app s'il s'appelle ios.app
          if [ -d "$APP_DIR/ios.app" ]; then
            mv "$APP_DIR/ios.app" "$APP_DIR/MyTaskUp.app"
            APP="$APP_DIR/MyTaskUp.app"
          fi
          
          # Renommer le binaire interne s'il s'appelle ios
          if [ -f "$APP/ios" ]; then
            mv "$APP/ios" "$APP/MyTaskUp"
          fi
          
          # Appliquer les droits d'exécution sur le binaire final
          chmod +x "$APP/MyTaskUp"
          
          # Mettre à jour le Info.plist
          if [ -f "$APP/Info.plist" ]; then
            plutil -replace CFBundleExecutable -string "MyTaskUp" "$APP/Info.plist"
          fi
          
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr MyTaskUp.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyTaskUp-unsigned
          path: MyTaskUp.ipa
