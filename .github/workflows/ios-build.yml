name: Build Godot iOS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export iOS Project
        uses: firebelley/godot-export@v5.2.0
        with:
          godot-version: 4.3
          wine: false
